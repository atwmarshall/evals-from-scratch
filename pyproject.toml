[project]
name = "evals-from-scratch"
version = "0.1.0"
description = "LLM evaluation framework built from first principles - nine scorers, plus scorer-reliability and model-robustness analysis. No eval libraries."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "ollama>=0.4.0",
    "tqdm>=4.66.0",
    "tabulate>=0.9.0",
    "jsonschema>=4.23.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.2",
    "questionary>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.14.0",
    "mypy>=1.18.0",
    "types-tabulate",
    "types-tqdm",
    "types-jsonschema",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evals", "runners", "scripts"]

dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.14.0",
    "mypy>=1.18.0",
    "types-tabulate",
    "types-tqdm",
    "types-jsonschema",
]

[tool.ruff]
line-length = 100
src = ["evals", "scripts", "runners"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "SIM101", # duplicate isinstance
    "PLE",    # pylint errors
]
# E501: long lines are readable here and reflow would churn the scorer prompts.
# DTZ is deliberately off: run artifacts are named by *local* date/time
# (results/YYYY-MM-DD/HHMMSS) because they are read by a human on this machine.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["evals", "scripts", "runners"]
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
# Not --strict: most of the codebase is annotated, but untyped test helpers and
# argparse Namespace access would drown the signal. Tighten when that stops being true.
